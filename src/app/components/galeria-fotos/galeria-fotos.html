<div class="galeria">

    <div
        class="foto"
        *ngFor="let foto of fotos"
        (click)="seleccionar(foto)">

        <img
            [src]="foto.url"
            [alt]="foto.titulo">

        <h3>{{ foto.titulo }}</h3>

        <p>{{ foto.tipo }}</p>

    </div>

</div>

<p *ngIf="fotos.length==0">

No hay fotografías disponibles

</p>
